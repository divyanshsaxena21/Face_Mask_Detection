<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog vs Cat Classifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Upload an Image to Classify</h1>
    <form id="upload-form">
        <input type="file" name="file" accept="image/*" required>
        <button type="submit">Predict</button>
    </form>
    <img id="uploaded-image" src="" alt="Uploaded Image" style="display: none; max-width: 300px; margin: 20px auto;"/>
    <h2 id="result"></h2>

    <script>
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const fileInput = document.querySelector('input[type="file"]');
            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(event) {
                const imgElement = document.getElementById('uploaded-image');
                imgElement.src = event.target.result;

                // After loading the image, submit the form data
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.error) {
                    document.getElementById('result').innerText = `Error: ${result.error}`;
                } else if (result.prediction) {
                    document.getElementById('result').innerText = `Prediction: ${result.prediction}`;
                } else {
                    document.getElementById('result').innerText = 'An unknown error occurred.';
                }
                
                // Show the uploaded image
                imgElement.style.display = 'block';
            };

            reader.readAsDataURL(file);  // Read the file as a data URL
        });
    </script>
</body>
</html>
